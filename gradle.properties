pluginGroup=it.emanuelemelini.cfmlextracompletion
pluginVersion=0.1.2

# Target platform: IntelliJ IDEA Ultimate 2026.2 (build IU-262.8665.258)
platformType=IU
platformVersion=2026.2

# CFML plugin (Marketplace, id "CFML Support") build compatible with 262.x
cfmlPluginVersion=262.8665.176

# since/until build range. Note: "262.*" limits the plugin to 2026.2.x only. Widen (e.g. raise on each
# new IDE you validate against) or drop the upper bound to reach later IDEs — at the risk of future breakage.
pluginSinceBuild=262
pluginUntilBuild=262.*

# Release notes shown on the Marketplace for this version (HTML allowed). Override per release with
# -PpluginChangeNotes="..."; defaults to "Initial release." if unset.
pluginChangeNotes=<b>0.1.2</b><ul><li>Ctrl/Cmd+Click (Go To Declaration) on contributed variables and functions jumps to where they are declared in Application.cfm / Application.cfc / included files; also navigates cfinclude paths that resolve through a this.mappings alias.</li><li>session.* and request.* variables (set in Application.cfm/.cfc/included files) now complete like application.*.</li><li>Contributed functions now show their parameter signature in completion and provide a parameter-info hint (Ctrl+P, and while typing arguments).</li><li>Function documentation (a preceding comment or the tag hint) is shown in the completion doc pane and via Quick Documentation (Ctrl+Q) on the function name.</li><li>Application.cfm variables assigned as application.* (e.g. &lt;cfset application.test = 1&gt;) appear in application-scope completion.</li><li>Scope members match the built-in completion look: shown qualified (application.name), typed text highlighted, and surfaced while typing the scope name (before the dot).</li><li>Project-wide completion from the nearest Application.cfm, Application.cfc (application/this scope), and the cfinclude graph; unresolved-reference warnings suppressed for these known symbols.</li><li>Opt-in features: resolve this.mappings for cfinclude, and merge ancestor Application files (Settings, Other Settings, Cfml Extra Completion).</li></ul>

# Publishing/signing read from ENVIRONMENT VARIABLES (never commit secrets):
#   PUBLISH_TOKEN, CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD
# Optional pre-release channel: -PpluginChannel=eap

org.gradle.jvmargs=-Xmx2048m
org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.stdlib.default.dependency=false
