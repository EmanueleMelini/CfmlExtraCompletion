pluginGroup=it.emanuelemelini.cfmlextracompletion
pluginVersion=0.1.1

# Target platform: IntelliJ IDEA Ultimate 2026.2 (build IU-262.8665.258)
platformType=IU
platformVersion=2026.2

# CFML plugin (Marketplace, id "CFML Support") build compatible with 262.x
cfmlPluginVersion=262.8665.176

# since/until build range. Note: "262.*" limits the plugin to 2026.2.x only. Widen (e.g. raise on each
# new IDE you validate against) or drop the upper bound to reach later IDEs — at the risk of future breakage.
pluginSinceBuild=262
pluginUntilBuild=262.*

# Release notes shown on the Marketplace for this version (HTML allowed). Override per release with
# -PpluginChangeNotes="..."; defaults to "Initial release." if unset.
pluginChangeNotes=<b>0.1.1 - initial release</b><ul><li>Project-wide completion from the nearest Application.cfm, Application.cfc (application/this scope), and the cfinclude graph.</li><li>Suppresses the CFML unresolved-reference warning for these known symbols.</li><li>Opt-in features: resolve this.mappings for cfinclude, and merge ancestor Application files (Settings, Other Settings, Cfml Extra Completion).</li></ul>

# Publishing/signing read from ENVIRONMENT VARIABLES (never commit secrets):
#   PUBLISH_TOKEN, CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD
# Optional pre-release channel: -PpluginChannel=eap

org.gradle.jvmargs=-Xmx2048m
org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.stdlib.default.dependency=false
