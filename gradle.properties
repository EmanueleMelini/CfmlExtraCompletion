pluginGroup=it.emanuelemelini.cfmlextracompletion
pluginGroupDev=it.emanuelemelini.cfmlextracompletion.dev
# Two release channels (the dev build uses a separate plugin id, so the version lines are independent):
#   pluginVersion    = PROD (published). Bumped on release: z for a minor release, y for a major one.
#   pluginVersionDev = DEV (-PdevBuild=true). z bumped on every edit round.
pluginVersion=1.0.0
pluginVersionDev=0.1.14

# Target platform: IntelliJ IDEA Ultimate 2026.2 (build IU-262.8665.258)
platformType=IU
# Compile against the oldest supported build; verify against this AND the newest 2026.2.x (below).
platformVersion=2026.2
platformVersionLatest=2026.2.2

# CFML plugin (Marketplace, id "CFML Support") build compatible with 262.x
cfmlPluginVersion=262.8665.176

# since/until build range. Note: "262.*" limits the plugin to 2026.2.x only. Widen (e.g. raise on each
# new IDE you validate against) or drop the upper bound to reach later IDEs &mdash; at the risk of future breakage.
pluginSinceBuild=262
pluginUntilBuild=262.*

# Release notes shown on the Marketplace for this version (HTML allowed). Override per release with
# -PpluginChangeNotes="..."; defaults to "Initial release." if unset.
pluginChangeNotes=<b>1.0.0</b><ul><li>Query support: inside &lt;cfoutput query&gt; / &lt;cfloop query&gt;, the query's columns complete (unqualified and as q.column) from a same-file &lt;cfquery&gt; SELECT list or queryNew(...). With a data source attached, SELECT * and alias.* expand to the real schema columns across FROM/JOIN tables.</li><li>q.column also works outside a loop (ColdFusion first-row dot notation), and query names complete inside the query="" attribute.</li><li>Ctrl/Cmd+Click and Quick Documentation now work for query names and query columns.</li><li>New Tools action "CFML Extra Completion: Diagnose Query Schema" to inspect the data source integration when SELECT * expansion does not resolve.</li><li>Fixes: comments mentioning cfquery/queryNew no longer break query parsing; no duplicate entries for same-file symbols or standard Application.cfc settings.</li></ul>

# Publishing/signing read from ENVIRONMENT VARIABLES (never commit secrets):
#   PUBLISH_TOKEN, CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD
# Optional pre-release channel: -PpluginChannel=eap

org.gradle.jvmargs=-Xmx2048m
org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.stdlib.default.dependency=false
